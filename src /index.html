<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Discovery Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header">
    <p class="eyebrow">Film Discovery Explorer</p>

    <h1>Find a short film to watch.</h1>

    <p>
      Explore a small collection of short films using characteristics
      such as form, subject, country, runtime and year.
    </p>
  </header>

  <main>

    <section>
      <div class="section-heading">
        <div>
          <p class="eyebrow">Film collection</p>
          <h2>Explore the films</h2>
        </div>

        <p id="film-count">0 films</p>
      </div>

      <div id="film-grid" class="film-grid">
        <!-- Film cards will appear here -->
      </div>
    </section>

  </main>

  <footer>
    <p>Film Discovery Explorer</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
